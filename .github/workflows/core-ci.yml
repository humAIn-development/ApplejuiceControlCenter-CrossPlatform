name: AJCC Cross-platform CI

on:
  push:
    branches:
      - "foundation/**"
      - "firstlight/**"
    paths:
      - "src/AJCC.Core/**"
      - "src/AJCC.Desktop/**"
      - "tests/AJCC.Core.Tests/**"
      - "tools/AJCC.Core.Probe/**"
      - "ApplejuiceControlCenter-CrossPlatform.sln"
      - ".github/workflows/core-ci.yml"
  pull_request:
    paths:
      - "src/AJCC.Core/**"
      - "src/AJCC.Desktop/**"
      - "tests/AJCC.Core.Tests/**"
      - "tools/AJCC.Core.Probe/**"
      - "ApplejuiceControlCenter-CrossPlatform.sln"
      - ".github/workflows/core-ci.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ApplejuiceControlCenter-CrossPlatform.sln

      - name: Build
        run: dotnet build ApplejuiceControlCenter-CrossPlatform.sln --configuration Release --no-restore /p:GitBranch="${{ github.ref_name }}" /p:GitCommit="${{ github.sha }}" /p:CiRunId="${{ github.run_id }}" /p:CiRunNumber="${{ github.run_number }}"

      - name: Test Core
        run: dotnet test tests/AJCC.Core.Tests/AJCC.Core.Tests.csproj --configuration Release --no-build --verbosity normal
